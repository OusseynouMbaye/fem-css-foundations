<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>Document</title>
    <style>
      input[type="checkbox"] {
        display: none;
      }

      .container img {
        margin: 100px;
        transition: transform 0.25s ease;
        cursor: zoom-in;
      }

      input[type="checkbox"]:checked ~ label > img {
        transform: scale(3);
        cursor: zoom-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="checkbox" id="zoomCheck" />
      <label for="zoomCheck">
        <img src="https://via.placeholder.com/200" />
      </label>
    </div>
  </body>
</html>
